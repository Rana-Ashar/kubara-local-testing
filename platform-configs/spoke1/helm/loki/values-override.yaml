In Grafana Alloy, `external_labels` is specified inside `prometheus.remote_write` as an `external_labels` attribute (map) or added via relabeling rules using `prometheus.relabel` before forwarding to `prometheus.remote_write`. Furthermore, `prometheus.remote_write` in Alloy supports `external_labels = { "cluster" = "spoke1" }` directly inside `prometheus.remote_write` **only** if placed correctly, or external labels can be attached using a `prometheus.relabel` step.

Let's use a `prometheus.relabel` component to attach the `cluster="spoke1"` label cleanly across all metrics before passing them to `prometheus.remote_write.thanos`. This is guaranteed to work across all Alloy versions without configuration parsing errors.

### Step 50: Update `values-override.yaml` with `prometheus.relabel`

Let's update `platform-configs/spoke1/helm/loki/values-override.yaml`:

```bash
cat <<'EOF' > platform-configs/spoke1/helm/loki/values-override.yaml
alloy:
  alloy:
    configMap:
      content: |-
        discovery.kubernetes "pod" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pod.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action = "replace"
            target_label = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action = "replace"
            target_label = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            action = "replace"
            target_label = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "job"
            separator = "/"
            replacement = "$1"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "__path__"
            separator = "/"
            replacement = "/var/log/pods/*$1/*.log"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_id"]
            action = "replace"
            target_label = "container_runtime"
            regex = "^(\\S+):\\/\\/.+$"
            replacement = "$1"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }

        prometheus.operator.servicemonitors "all" {
          forward_to = [prometheus.relabel.add_cluster_label.receiver]
        }

        prometheus.operator.podmonitors "all" {
          forward_to = [prometheus.relabel.add_cluster_label.receiver]
        }

        prometheus.relabel "add_cluster_label" {
          forward_to = [prometheus.remote_write.thanos.receiver]

          rule {
            target_label = "cluster"
            replacement  = "spoke1"
          }
        }

        prometheus.remote_write "thanos" {
          endpoint {
            url = "[http://172.18.0.2/api/v1/receive](http://172.18.0.2/api/v1/receive)"
            headers = {
              "Host" = "thanos-receive.172.18.0.3.traefik.me",
            }
          }
        }
