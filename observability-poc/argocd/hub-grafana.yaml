---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-poc-hub-grafana
  namespace: argocd
spec:
  project: observability-poc

  source:
    repoURL: https://github.com/Rana-Ashar/kubara-local-testing.git
    targetRevision: main
    path: observability-poc/hub/grafana

  destination:
    name: hub-cluster
    namespace: kube-prometheus-stack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
