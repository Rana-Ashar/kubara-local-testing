---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-poc-spoke-1-alloy
  namespace: argocd
spec:
  project: hub-cluster-local

  source:
    repoURL: https://github.com/Rana-Ashar/kubara-local-testing.git
    targetRevision: main
    path: observability-poc/spoke/alloy

  destination:
    name: spoke-1
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
