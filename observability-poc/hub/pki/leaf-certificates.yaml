apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: telemetry-server
  namespace: observability
spec:
  secretName: telemetry-server-tls
  commonName: loki.172.18.0.4.traefik.me
  dnsNames:
    - loki.172.18.0.4.traefik.me
    - thanos.172.18.0.4.traefik.me
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - server auth
  issuerRef:
    name: telemetry-ca
    kind: Issuer
